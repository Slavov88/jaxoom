[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxoom"
version = "0.1.0"
description = "Static and compiler-backed memory analysis for JAX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4"]
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/Slavov88/jaxoom"
Issues = "https://github.com/Slavov88/jaxoom/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
